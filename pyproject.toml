[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specrender"
version = "0.2.0"
description = "Render spectrogram images and interactive HTML spectrogram players from audio files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Nelms" }]
keywords = ["spectrogram", "audio", "dsp", "fft", "visualization", "sdr", "image"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "Pillow>=9.1"]

[project.optional-dependencies]
annotate = ["matplotlib>=3.6"]
formats = ["soundfile>=0.12"]
all = ["matplotlib>=3.6", "soundfile>=0.12"]
dev = ["pytest>=7", "matplotlib>=3.6", "soundfile>=0.12"]
browser = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/kk4cnm/specrender"
Documentation = "https://github.com/kk4cnm/specrender/tree/main/docs"
Issues = "https://github.com/kk4cnm/specrender/issues"
Changelog = "https://github.com/kk4cnm/specrender/blob/main/CHANGELOG.md"

[project.scripts]
specrender = "specrender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specrender = ["web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
