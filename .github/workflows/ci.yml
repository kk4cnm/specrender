name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  core-only:
    # Make sure the package works without the optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q

  browser:
    # Drives the HTML player in headless Chromium: seek, scrub, select, loop, keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev,browser]" && python -m playwright install --with-deps chromium
      - run: python examples/make_player_demo.py
      - name: Hosted-audio fixture (audio_url + start offset)
        run: |
          python - <<'PY'
          import numpy as np, specrender as sr
          from scipy.io import wavfile
          fs = 22050; t = np.arange(6 * fs) / fs
          wavfile.write("hosted.wav", fs, (0.3 * np.sin(2 * np.pi * 440 * t) * 32767).astype(np.int16))
          sr.player("hosted.wav", "offset.html", audio_url="hosted.wav", start=2, end=4, scale="mel", height=240)
          PY
      - run: python tests/browser_check.py docs/player-demo.html - offset.html
